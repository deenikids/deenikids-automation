name: Daily automatic publishing

# Runs by itself every day at 00:05 IST (18:35 UTC the day before).
# Makes today's 2 episodes + 3 Shorts in English and Hinglish, checks them and uploads them.
on:
  schedule:
    - cron: "35 18 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Plan day to make (1-1000). Leave empty for today."
        required: false
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libraqm0 libfribidi0

      - name: Cache AI voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Make, check and upload today's videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.day }}" ]; then ARGS="--day ${{ github.event.inputs.day }}"; fi
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          python scripts/daily.py $ARGS

      - name: Keep a copy of the videos for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-videos-${{ github.run_id }}
          path: |
            output/*/episodes/
            output/*/shorts/
            output/*/thumbnails/
            output/*/qc_report.json
          retention-days: 7

      - name: Save ledger and reports (prevents duplicate uploads)
        if: always()
        run: |
          git config user.name "deeni-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database/uploads.json reports/ content/songs/ || true
          git diff --cached --quiet || (git commit -m "Daily run: ledger and reports" && git push)
